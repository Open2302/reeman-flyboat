<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление роботом</title>
    <link rel="stylesheet" href="main_style.css">
</head>

<body>
    <h1>PSS Logist</h1>

    <header>
        <h2>Статус робота</h2>
    </header>

    <div id="status">
        <div>
            <span class="label">Заряд батареи:</span>
            <span class="value" id="battery">--</span>%
            <img src="reference/battery.gif" id="batteryAnimation" class="battery-gif">
        </div>

        <div>
            <span class="label">⚡ :</span>
            <span class="value" id="chargeFlag">--</span>
        </div>

        <div>
            <span class="label">Место:</span>
            <span class="value" id="goal">--</span>
        </div>

        <div>
            <span class="label">Скорость:</span>
            <span class="value" id="speed">--</span> м/с
        </div>

        <div>
            <span class="label">Маршрут:</span>
            <!-- <span class="value" id="speed">--</span> м/с -->
        </div>

        <div>
            <span class="label">Аварийные кнопки:</span>
            <span class="value" id="emergency">--</span>
        </div>
    </div>

    <hr>

    <button class="DotButton" id="OP1">ОП 1</button>
    <button class="DotButton" id="OP2">ОП 2</button>
    <button class="DotButton" id="OP3">ОП 3</button>
    <button class="DotButton" id="OP4">ОП 4</button>
    <button class="DotButton" id="Route">Маршрут</button>
    <button class="DotButton" id="lift"></button>

    <script src="main_script.js"></script>


</body>

</html>
