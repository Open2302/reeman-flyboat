<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Пульт управления — Корпорация ПСС</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <main class="panel">

        <!-- ===== Шапка с логотипом ===== -->
        <header class="panel__header">
            <div class="logo">
                <svg class="logo__icon" viewBox="0 0 72 62" aria-hidden="true">
          <defs>
            <clipPath id="pyramid">
              <polygon points="36,0 72,62 0,62"/>
            </clipPath>
          </defs>
          <polygon points="36,0 72,62 0,62" fill="#e0324c"/>
          <g clip-path="url(#pyramid)" stroke="#ffffff" stroke-width="5" fill="none">
            <line x1="0"  y1="20" x2="72" y2="20"/>
            <line x1="0"  y1="36" x2="72" y2="36"/>
            <line x1="0"  y1="50" x2="72" y2="50"/>
            <line x1="44" y1="64" x2="74" y2="28"/>
          </g>
        </svg>
                <div class="logo__text">
                    <span class="logo__caption">® КОРПОРАЦИЯ</span>
                    <span class="logo__name">ПСС</span>
                </div>
            </div>
            <button id="fullscreen-btn" type="button" class="fullscreen-btn">На весь экран</button>
        </header>

        <!-- ===== Статус-бар ===== -->
        <section class="statusbar">

            <!-- батарейка -->
            <div class="battery" title="Заряд батареи"></div>

            <!-- точка -->
            <div class="statusbar__item">Точка:&nbsp; ОП1</div>

            <!-- движение + индикатор -->
            <div class="statusbar__item statusbar__motion">
                Движение
                <span class="statusbar__dot"></span>
            </div>

            <!-- метка карты -->
            <svg class="statusbar__icon" viewBox="0 0 24 32" aria-hidden="true">
        <path d="M12 0C5.4 0 0 5.3 0 11.9 0 20.9 12 32 12 32s12-11.1 12-20.1C24 5.3 18.6 0 12 0z" fill="#ffffff"/>
        <circle cx="12" cy="12" r="4.6" fill="#d8d8d8"/>
      </svg>

            <!-- предупреждение -->
            <svg class="statusbar__icon statusbar__icon--warn" viewBox="0 0 34 30" aria-hidden="true">
        <path d="M17 3 L31 27 H3 Z" fill="#8b8b8b" stroke="#8b8b8b" stroke-width="5" stroke-linejoin="round"/>
        <rect x="15.4" y="10" width="3.2" height="10" rx="1.6" fill="#ffffff"/>
        <circle cx="17" cy="24" r="2" fill="#ffffff"/>
      </svg>

        </section>

        <!-- ===== Основное содержимое ===== -->
        <section class="content">

            <!-- Сетка кнопок точек -->
            <div class="points">
                <button class="btn btn--point">ОП1</button>
                <button class="btn btn--point">ОП2</button>
                <button class="btn btn--point">ОП3</button>
                <button class="btn btn--point">ОП4</button>
                <button class="btn btn--point">ОП5</button>
                <button class="btn btn--point">ВП1</button>
                <button class="btn btn--point">ВП2</button>
                <button class="btn btn--point">ВП3</button>
                <button class="btn btn--point">ВП4</button>
                <button class="btn btn--point">ВП5</button>
                <button class="btn btn--point">АС</button>
                <button class="btn btn--point">ВП2.1-3.1</button>
            </div>

            <!-- Нижние кнопки действий -->
            <div class="actions">
                <button class="btn btn--action btn--lift">Вызов лифта</button>
                <button class="btn btn--action btn--charge">Зарядка</button>
                <button id="Route" type="button" class="btn btn--action btn--route">Маршрут</button>
            </div>

        </section>

        <p id="route-message" class="route-message" role="status" aria-live="polite"></p>
    </main>

    <div id ="modal" class="modal-overlay hidden">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="route-title">
<header class="route-header"><span class="eyebrow">ПЛАНИРОВАНИЕ</span><h2 id="route-title">Новый маршрут</h2><p>Выберите точки в нужном порядке</p></header>
            <div class="route-builder">
                <div id ="points-panel" class="route-editor-panel">
                    <h3>Добавить остановку</h3>
                    <ul id ="points-list" class ="points-list">
                        <li><button class="DotButton">ОП5</button></li>
                            <li><button class="DotButton">ОП4</button></li>
                            <li><button class="DotButton">ОП3</button></li>
                            <li><button class="DotButton">ОП2</button></li>
                            <li><button class="DotButton">ОП1</button></li>
                            <li><button class="DotButton">АС</button></li>
                            <li><button class="DotButton">ВП5</button></li>
                            <li><button class="DotButton">ВП4_1</button></li>
                            <li><button class="DotButton">ВП4_2</button></li>
                            <li><button class="DotButton">ВП3</button></li>
                            <li><button class="DotButton">ВП2</button></li>
                            <li><button class="DotButton">ВП1</button></li>
                            <li><button class="DotButton">ВП2.1,3.1</button></li>
                            <li><button class="DotButton">Зарядка</button></li>
                            <li><button class="DotButton">ворота</button></li>
                            <li><button class="DotButton">склад</button></li>
                 </ul>
                </div>
                <div id ="route-panel" class="route-editor-panel">
                <h3>Ваш маршрут <span id="route-count" class="route-count">0</span></h3><p id="route-empty" class="route-empty">Маршрут пока пуст.<br>Добавьте первую остановку из списка точек.</p>
                   <ol id="points-list-route" class="points-list route-order">
                   </ol>
                   <p class="route-hint">После последней остановки робот вернётся на зарядку.</p><div id="route-panel-footer" class="route-panel-footer hidden">
                        <button id="send-route-btn" type="button" class="route-panel-btn route-panel-btn--send">Подтвердить маршрут →</button>
                        <button id="clear-route-btn" type="button" class="route-panel-btn route-panel-btn--clear">Очистить</button>
                    </div>
                </div>
            </div>
            <button type="button" class="close-btn" aria-label="Закрыть маршрут">&times;</button>
        </div>
    </div>
    <script src="../main_script.js"></script>
</body>

</html>
