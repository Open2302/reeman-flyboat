name: reeman-flyboat

services:
  panel:
    build:
      context: .
      target: runtime
    init: true
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8000}:8000"
    environment:
      ROBOT_URL: "${ROBOT_URL:-http://10.6.20.95}"
      DEMO: "${DEMO:-true}"
      DATA_DIR: /data
    volumes:
      - robot-data:/data
      - ./code:/app/code:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).close()"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    stop_grace_period: 30s

volumes:
  robot-data:
